name: Release AAB (manual)

# Opt-in: builds a signed Play App Bundle. Never runs on push. Fails hard when
# the release key secrets are missing; it never falls back to debug signing.
on:
  workflow_dispatch:

concurrency:
  group: release-aab
  cancel-in-progress: true

jobs:
  aab:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      BUILD_SOURCE_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Require release signing secrets
        env:
          K: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          P: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          A: ${{ secrets.RELEASE_KEY_ALIAS }}
          KP: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          for v in K P A KP; do
            if [ -z "${!v}" ]; then echo "::error::Release signing secret missing; refusing to build an unsigned or debug-signed AAB"; exit 1; fi
          done
      - name: Decode keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: echo "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
      - name: Unit tests
        run: chmod +x gradlew && ./gradlew testDebugUnitTest --no-daemon
      - name: Bundle release
        env:
          RELEASE_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew bundleRelease --no-daemon
      - name: Name AAB after its source commit
        id: aab
        run: |
          SHORT=${BUILD_SOURCE_SHA::7}
          NAME="MyPersonalCrossword-${SHORT}-release.aab"
          cp app/build/outputs/bundle/release/app-release.aab "$NAME"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "short=$SHORT" >> "$GITHUB_OUTPUT"
          sha256sum "$NAME"
      - uses: actions/upload-artifact@v4
        with:
          name: app-release-aab-${{ steps.aab.outputs.short }}
          path: ${{ steps.aab.outputs.name }}
          if-no-files-found: error
          retention-days: 30
      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
