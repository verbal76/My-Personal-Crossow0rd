name: Build Debug APK

on:
  push:
    branches:
      - main
      - 'claude/**'
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # The branch head this build represents (PR runs check out a merge commit).
      BUILD_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      # Secrets can't be tested in `if:`, so expose only whether one exists.
      # The release steps below run only when the owner has added a release key.
      HAS_RELEASE_KEY: ${{ secrets.RELEASE_KEYSTORE_BASE64 != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history. CI's build number (versionCode) is 1000 + the run
          # number; the commit count is only the local-build fallback.
          fetch-depth: 0

      # AGP 9 / Gradle 9 require JDK 17+ to run the build.
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Name APK after its source commit
        id: apk
        run: |
          SHORT=${BUILD_SOURCE_SHA::7}
          NAME="MyPersonalCrossword-${SHORT}-debug.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$NAME"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "short=$SHORT" >> "$GITHUB_OUTPUT"
          echo "APK: $NAME"
          sha256sum "$NAME"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk-${{ steps.apk.outputs.short }}
          path: ${{ steps.apk.outputs.name }}
          if-no-files-found: error
          retention-days: 30

      - name: Lint
        run: ./gradlew lintDebug --no-daemon

      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.*
          if-no-files-found: ignore
          retention-days: 14

      # ── Signed release APK (only once a release key exists) ──────────────
      # See docs/EXTERNAL_ACTIONS.md "Create a release signing key". Without the
      # RELEASE_KEYSTORE_BASE64 secret these steps are skipped and the debug
      # pipeline above is unchanged.
      - name: Decode release keystore
        if: env.HAS_RELEASE_KEY == 'true'
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: echo "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"

      - name: Build signed release APK
        if: env.HAS_RELEASE_KEY == 'true'
        env:
          RELEASE_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Name release APK after its source commit
        if: env.HAS_RELEASE_KEY == 'true'
        id: release_apk
        run: |
          SHORT=${BUILD_SOURCE_SHA::7}
          NAME="MyPersonalCrossword-${SHORT}-release.apk"
          # app-release.apk only exists if signing was applied (an unsigned
          # build is app-release-unsigned.apk), so this fails loudly otherwise.
          cp app/build/outputs/apk/release/app-release.apk "$NAME"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "short=$SHORT" >> "$GITHUB_OUTPUT"
          echo "APK: $NAME"
          sha256sum "$NAME"

      - name: Upload release APK artifact
        if: env.HAS_RELEASE_KEY == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk-${{ steps.release_apk.outputs.short }}
          path: ${{ steps.release_apk.outputs.name }}
          if-no-files-found: error
          retention-days: 30

      - name: Remove release keystore
        if: always() && env.HAS_RELEASE_KEY == 'true'
        run: rm -f "$RUNNER_TEMP/release.jks"
