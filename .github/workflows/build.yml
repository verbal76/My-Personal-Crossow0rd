name: Build (manual or build-tag only)

# GitHub-hosted minutes are scarce (see "GitHub Actions budget policy" in CLAUDE.md), so this
# workflow does NOT run on ordinary pushes or pull requests. It runs only when asked:
#   * push a tag named build-*   -> tests + lint + APK + GitHub Release (a delivered build)
#       git tag build-v11 && git push origin build-v11
#   * Run workflow (workflow_dispatch) -> tests + lint; tick "build_apk" for an APK and
#     "publish_release" to also create the Release.
on:
  push:
    tags: ['build-*']
  workflow_dispatch:
    inputs:
      build_apk:
        description: 'Also build and inspect the debug APK'
        type: boolean
        default: false
      publish_release:
        description: 'Create the GitHub Release for the VERSION file (needs build_apk)'
        type: boolean
        default: false

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write   # lets the release step create the GitHub Release

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      BUILD_SOURCE_SHA: ${{ github.sha }}
      # A tag build always builds and publishes; a manual run does so only if asked.
      BUILD_APK: ${{ startsWith(github.ref, 'refs/tags/build-') || inputs.build_apk == true }}
      PUBLISH_RELEASE: ${{ startsWith(github.ref, 'refs/tags/build-') || (inputs.build_apk == true && inputs.publish_release == true) }}
      # Secrets can't be tested in `if:`, so expose only whether one exists.
      # The release steps below run only when the owner has added a release key.
      HAS_RELEASE_KEY: ${{ secrets.RELEASE_KEYSTORE_BASE64 != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history. CI's build number (versionCode) is 1000 + the run
          # number; the commit count is only the local-build fallback.
          fetch-depth: 0

      # AGP 9 / Gradle 9 require JDK 17+ to run the build.
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Build debug APK
        if: env.BUILD_APK == 'true'
        run: ./gradlew assembleDebug --no-daemon

      - name: Name APK after its source commit
        if: env.BUILD_APK == 'true'
        id: apk
        run: |
          SHORT=${BUILD_SOURCE_SHA::7}
          VER="v$(tr -d '[:space:]' < VERSION)"
          NAME="My-Personal-Crossword-${VER}.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$NAME"
          echo "ver=$VER" >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "short=$SHORT" >> "$GITHUB_OUTPUT"
          echo "APK: $NAME"
          sha256sum "$NAME"

      # ── Inspect the APK actually built (Tartaria lesson: targetSdk 36 does not
      # prove 16 KB compliance; read the artifact itself). ───────────────────
      - name: Inspect built APK (identity, permissions, native libs, 16 KB)
        if: env.BUILD_APK == 'true'
        continue-on-error: true
        run: |
          APK="${{ steps.apk.outputs.name }}"
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          echo "build-tools: $(basename "$BT")"
          echo "=== gradle distribution sha256 (pin this in gradle-wrapper.properties) ==="
          sha256sum ~/.gradle/wrapper/dists/gradle-*-bin/*/gradle-*-bin.zip 2>/dev/null || echo "(wrapper zip not retained)"
          echo "=== APK size / sha256 ==="
          ls -l "$APK"; sha256sum "$APK"
          echo "=== badging (package, versions, sdk) ==="
          "$BT/aapt2" dump badging "$APK" | grep -E "^package:|sdkVersion|targetSdkVersion|native-code|compileSdk"
          echo "=== effective permissions (merged manifest) ==="
          "$BT/aapt2" dump permissions "$APK" | sort -u
          echo "=== native libraries ==="
          mkdir -p "$RUNNER_TEMP/apkx" && unzip -q -o "$APK" 'lib/*' -d "$RUNNER_TEMP/apkx" || true
          SOS=$(find "$RUNNER_TEMP/apkx" -name '*.so' 2>/dev/null | sort)
          if [ -z "$SOS" ]; then
            echo "NO native .so libraries in the APK: 16 KB ELF check not applicable"
          else
            BAD=0
            for so in $SOS; do
              A=$(readelf -lW "$so" | awk '$1=="LOAD"{print $NF}' | sort -u | head -1)
              echo "$so  LOAD align=$A"
              [ $((A)) -ge 16384 ] || BAD=$((BAD+1))
            done
            echo "16 KB ELF RESULT: $BAD library(ies) below 0x4000"
            [ "$BAD" -eq 0 ] || exit 1
          fi
          echo "=== zipalign -c -P 16 (packaging) ==="
          "$BT/zipalign" -c -P 16 -v 4 "$APK" > "$RUNNER_TEMP/za.txt" 2>&1 && echo "ZIPALIGN 16 KB: PASS" || { tail -5 "$RUNNER_TEMP/za.txt"; echo "ZIPALIGN 16 KB: FAIL"; exit 1; }
          "$BT/apksigner" verify --print-certs "$APK" | head -3

      - name: Upload APK artifact
        if: env.BUILD_APK == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: My-Personal-Crossword-${{ steps.apk.outputs.ver }}-${{ steps.apk.outputs.short }}
          path: ${{ steps.apk.outputs.name }}
          if-no-files-found: error
          retention-days: 14

      # ── Public release: one GitHub Release per public version ────────────
      # The version lives in the VERSION file. A release is created once per
      # version, from this exact APK (no rebuild, no renaming), marked Latest.
      # To deliver a new playable build: bump VERSION, push, then push a build-* tag.
      # See docs/RELEASES.md.
      - name: Publish GitHub Release (once per version)
        if: env.PUBLISH_RELEASE == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VER="${{ steps.apk.outputs.ver }}"
          FILE="${{ steps.apk.outputs.name }}"
          if gh release view "$VER" >/dev/null 2>&1; then
            echo "Release $VER already exists; leaving it untouched. Bump VERSION to deliver a new build."
            exit 0
          fi
          sha256sum "$FILE" > "${FILE}.sha256"
          cat > "$RUNNER_TEMP/notes.md" <<EOF
          # My Personal Crossword ${VER}

          **Android:** \`${FILE}\`
          Install it over your existing app (do not uninstall first). This is a debug-signed test build, not a Play release.

          ## Technical details
          - Source commit: ${BUILD_SOURCE_SHA}
          - Android versionCode: ${{ github.run_number }} (+1000)
          - Package: com.hag.mypersonalcrossword
          - CI run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          - SHA-256: $(cut -d' ' -f1 "${FILE}.sha256")
          EOF
          sed -i 's/^          //' "$RUNNER_TEMP/notes.md"
          gh release create "$VER" "$FILE" "${FILE}.sha256" \
            --target "$BUILD_SOURCE_SHA" --title "My Personal Crossword ${VER}" \
            --notes-file "$RUNNER_TEMP/notes.md" --latest

      - name: Lint
        run: ./gradlew lintDebug --no-daemon

      - name: Upload test and lint reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.*
          if-no-files-found: ignore
          retention-days: 14

      # ── Signed release APK (only once a release key exists) ──────────────
      # See docs/EXTERNAL_ACTIONS.md "Create a release signing key". Without the
      # RELEASE_KEYSTORE_BASE64 secret these steps are skipped and the debug
      # pipeline above is unchanged.
      - name: Decode release keystore
        if: env.HAS_RELEASE_KEY == 'true' && env.BUILD_APK == 'true'
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: echo "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"

      - name: Build signed release APK
        if: env.HAS_RELEASE_KEY == 'true' && env.BUILD_APK == 'true'
        env:
          RELEASE_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Name release APK after its source commit
        if: env.HAS_RELEASE_KEY == 'true' && env.BUILD_APK == 'true'
        id: release_apk
        run: |
          SHORT=${BUILD_SOURCE_SHA::7}
          NAME="MyPersonalCrossword-${SHORT}-release.apk"
          # app-release.apk only exists if signing was applied (an unsigned
          # build is app-release-unsigned.apk), so this fails loudly otherwise.
          cp app/build/outputs/apk/release/app-release.apk "$NAME"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "short=$SHORT" >> "$GITHUB_OUTPUT"
          echo "APK: $NAME"
          sha256sum "$NAME"

      - name: Upload release APK artifact
        if: env.HAS_RELEASE_KEY == 'true' && env.BUILD_APK == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk-${{ steps.release_apk.outputs.short }}
          path: ${{ steps.release_apk.outputs.name }}
          if-no-files-found: error
          retention-days: 14

      - name: Remove release keystore
        if: always() && env.HAS_RELEASE_KEY == 'true' && env.BUILD_APK == 'true'
        run: rm -f "$RUNNER_TEMP/release.jks"
