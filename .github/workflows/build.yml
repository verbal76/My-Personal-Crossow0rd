name: Build (manual only - Android, Windows, Linux)

# THE one authoritative build entry point. Nothing here runs on a push, merge, tag or pull request:
# GitHub-hosted minutes are scarce (CLAUDE.md budget policy) and publishing is a separate decision.
# Start it explicitly (API/gh dispatch with ref = the branch that contains the approved SHA).
#
#   platform     android | windows | linux | all      (all = the three, built from ONE commit)
#   source_sha   the exact approved 40-char commit; every job checks out exactly this
#   build_number the studio build number; must equal VERSION at source_sha
#   destination  local_only (default)  artifacts stay in this run (14 days); nothing is published
#                github_releases       after EVERY selected platform passed, create the release
#                                      "My Personal Crossword Build NN" (tag build-NN at source_sha).
#                                      Never replaces an existing release or tag.
# Steam, Google Play and OTA are never touched. See docs/RELEASES.md.
on:
  workflow_dispatch:
    inputs:
      platform:
        type: choice
        options: [android, windows, linux, all]
        default: linux
      source_sha:
        description: 'Exact approved commit SHA (40 hex chars)'
        type: string
        required: true
      build_number:
        description: 'Studio build number (must equal VERSION at source_sha)'
        type: string
        required: true
      destination:
        type: choice
        options: [local_only, github_releases]
        default: local_only

concurrency:
  group: build-${{ inputs.source_sha }}
  cancel-in-progress: false      # never cancel a run that may be mid-publish

permissions:
  contents: read

env:
  BUILD_SOURCE_SHA: ${{ inputs.source_sha }}
  DESTINATION: ${{ inputs.destination }}
  BUILD_NUMBER: ${{ inputs.build_number }}

jobs:
  # ── 1. Validate the request and the source. Cheap; nothing is built. ──────────────────────
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      android: ${{ steps.p.outputs.android }}
      has_desktop: ${{ steps.p.outputs.has_desktop }}
      matrix: ${{ steps.p.outputs.matrix }}
      platforms: ${{ steps.p.outputs.platforms }}
    steps:
      - name: Validate inputs and select platforms
        id: p
        env:
          PLATFORM: ${{ inputs.platform }}
          SHA: ${{ inputs.source_sha }}
        run: |
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::source_sha must be a full 40-character commit SHA"; exit 1; }
          [[ "$BUILD_NUMBER" =~ ^[1-9][0-9]*$ ]] || { echo "::error::build_number must be a positive integer"; exit 1; }
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          p = os.environ["PLATFORM"]
          sel = {"android": ["android"], "linux": ["linux"], "windows": ["windows"], "all": ["android", "linux", "windows"]}[p]
          inc = []
          if "linux" in sel:
              inc.append({"platform": "linux", "os": "ubuntu-latest", "launcher": "MyPersonalCrossword/steam-launch.sh", "ext": "tar.gz"})
          if "windows" in sel:
              inc.append({"platform": "windows", "os": "windows-latest", "launcher": "MyPersonalCrossword/MyPersonalCrossword.exe", "ext": "zip"})
          has = bool(inc)
          if not inc:   # a matrix may not be empty; the desktop job is skipped by its `if` anyway
              inc.append({"platform": "none", "os": "ubuntu-latest", "launcher": "", "ext": ""})
          print("android=" + str("android" in sel).lower())
          print("has_desktop=" + str(has).lower())
          print("matrix=" + json.dumps({"include": inc}, separators=(",", ":")))
          print("platforms=" + ",".join(sel))
          PY
      - uses: actions/checkout@v4
        with: { ref: '${{ inputs.source_sha }}', fetch-depth: 0 }
      - name: Verify exact source, build number and lineage
        env:
          GITHUB_SHA: ${{ inputs.source_sha }}
        run: |
          [ "$(git rev-parse HEAD)" = "${{ inputs.source_sha }}" ] || { echo "::error::checked-out HEAD is not source_sha"; exit 1; }
          [ -z "$(git status --porcelain)" ] || { echo "::error::working tree is not clean"; exit 1; }
          [ "$(tr -d '[:space:]' < VERSION)" = "$BUILD_NUMBER" ] || { echo "::error::build_number does not match VERSION at source_sha"; exit 1; }
          python3 tools/verify_release_source.py
      - name: Release policy checks (workflows, verifier, gate, manifests)
        run: python3 tools/test_release_source.py
      - name: Refuse to reuse a build number or replace a release
        if: inputs.destination == 'github_releases'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          N="$BUILD_NUMBER"
          for t in "build-$N" "build-v$N" "v$N"; do
            if git rev-parse -q --verify "refs/tags/$t" >/dev/null; then echo "::error::tag $t already exists; a build number is never reused"; exit 1; fi
            if gh release view "$t" --repo "${{ github.repository }}" >/dev/null 2>&1; then echo "::error::release $t already exists"; exit 1; fi
          done

  # ── 2. Shared core + desktop tests (only when a desktop platform is selected). ────────────
  desktop-tests:
    needs: plan
    if: needs.plan.outputs.has_desktop == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with: { ref: '${{ inputs.source_sha }}', fetch-depth: 0 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - uses: gradle/actions/setup-gradle@v4
      - name: Shared core + desktop unit tests
        run: ./gradlew -p desktop test --no-daemon
      - name: Verify every declared suite ran
        run: python3 tools/verify_test_results.py --desktop

  # ── 3a. Android (existing steps and signing identity, unchanged; now one job of the build). ─
  android:
    needs: plan
    if: needs.plan.outputs.android == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      # Secrets can't be tested in `if:`, so expose only whether one exists. Only the signed-release
      # steps below receive the secret values.
      HAS_RELEASE_KEY: ${{ secrets.RELEASE_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: '${{ inputs.source_sha }}', fetch-depth: 0 }
      - name: Verify exact source and lineage
        env:
          GITHUB_SHA: ${{ inputs.source_sha }}
        run: |
          [ "$(git rev-parse HEAD)" = "${{ inputs.source_sha }}" ] || { echo "::error::checked-out HEAD is not source_sha"; exit 1; }
          python3 tools/verify_release_source.py
      # AGP 9 / Gradle 9 require JDK 17+ to run the build.
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - name: Unit tests
        run: ./gradlew testDebugUnitTest --no-daemon
      # CI must not report success by silently skipping tests: every test class declared in
      # app/src/test must have run with exactly its declared test count, none skipped or failed.
      - name: Verify every declared test suite ran
        run: python3 tools/verify_test_results.py
      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon
      - name: Name APK (studio standard)
        id: apk
        run: |
          N="$BUILD_NUMBER"
          NAME="My Personal Crossword Build ${N} APK.apk"
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk "dist/$NAME"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "APK: $NAME"
          sha256sum "dist/$NAME"
      # Read the artifact itself: targetSdk 36 does not prove 16 KB compliance.
      - name: Inspect built APK (identity, permissions, native libs, 16 KB)
        continue-on-error: true
        run: |
          APK="dist/${{ steps.apk.outputs.name }}"
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          echo "build-tools: $(basename "$BT")"
          echo "=== gradle distribution sha256 (pin this in gradle-wrapper.properties) ==="
          sha256sum ~/.gradle/wrapper/dists/gradle-*-bin/*/gradle-*-bin.zip 2>/dev/null || echo "(wrapper zip not retained)"
          echo "=== APK size / sha256 ==="
          ls -l "$APK"; sha256sum "$APK"
          echo "=== badging (package, versions, sdk) ==="
          "$BT/aapt2" dump badging "$APK" | grep -E "^package:|sdkVersion|targetSdkVersion|native-code|compileSdk"
          echo "=== effective permissions (merged manifest) ==="
          "$BT/aapt2" dump permissions "$APK" | sort -u
          echo "=== native libraries ==="
          mkdir -p "$RUNNER_TEMP/apkx" && unzip -q -o "$APK" 'lib/*' -d "$RUNNER_TEMP/apkx" || true
          SOS=$(find "$RUNNER_TEMP/apkx" -name '*.so' 2>/dev/null | sort)
          if [ -z "$SOS" ]; then
            echo "NO native .so libraries in the APK: 16 KB ELF check not applicable"
          else
            BAD=0
            for so in $SOS; do
              A=$(readelf -lW "$so" | awk '$1=="LOAD"{print $NF}' | sort -u | head -1)
              echo "$so  LOAD align=$A"
              [ $((A)) -ge 16384 ] || BAD=$((BAD+1))
            done
            echo "16 KB ELF RESULT: $BAD library(ies) below 0x4000"
            [ "$BAD" -eq 0 ] || exit 1
          fi
          echo "=== zipalign -c -P 16 (packaging) ==="
          "$BT/zipalign" -c -P 16 -v 4 "$APK" > "$RUNNER_TEMP/za.txt" 2>&1 && echo "ZIPALIGN 16 KB: PASS" || { tail -5 "$RUNNER_TEMP/za.txt"; echo "ZIPALIGN 16 KB: FAIL"; exit 1; }
          "$BT/apksigner" verify --print-certs "$APK" | head -3
      - name: Provenance manifest
        env:
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
          GITHUB_SHA: ${{ inputs.source_sha }}
        run: |
          python3 tools/make_release_manifest.py "dist/${{ steps.apk.outputs.name }}" dist/build-manifest-android.json --platform=android
          python3 tools/verify_release_source.py --manifest dist/build-manifest-android.json --apk "dist/${{ steps.apk.outputs.name }}"
      - name: Lint
        run: ./gradlew lintDebug --no-daemon
      - name: Upload APK + manifest
        uses: actions/upload-artifact@v4
        with:
          name: Build-${{ inputs.build_number }}-android-${{ inputs.source_sha }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14
      - name: Upload test and lint reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reports-android
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.*
          if-no-files-found: ignore
          retention-days: 14
      # ── Signed release APK (only once a release key exists; see docs/EXTERNAL_ACTIONS.md) ──
      # The secrets exist only in these steps, in this job, and are never reachable from a PR.
      - name: Decode release keystore
        if: env.HAS_RELEASE_KEY == 'true'
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: echo "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
      - name: Build signed release APK
        if: env.HAS_RELEASE_KEY == 'true'
        env:
          RELEASE_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon
      - name: Name release APK
        if: env.HAS_RELEASE_KEY == 'true'
        id: release_apk
        run: |
          NAME="My Personal Crossword Build ${BUILD_NUMBER} signed release APK.apk"
          # app-release.apk only exists if signing was applied (an unsigned build is
          # app-release-unsigned.apk), so this fails loudly otherwise.
          cp app/build/outputs/apk/release/app-release.apk "$NAME"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          sha256sum "$NAME"
      - name: Upload signed release APK (run artifact only; never attached to a release)
        if: env.HAS_RELEASE_KEY == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: signed-release-apk-${{ inputs.build_number }}-${{ inputs.source_sha }}
          path: ${{ steps.release_apk.outputs.name }}
          if-no-files-found: error
          retention-days: 14
      - name: Remove release keystore
        if: always() && env.HAS_RELEASE_KEY == 'true'
        run: rm -f "$RUNNER_TEMP/release.jks"

  # ── 3b. Windows / Linux desktop packages (no secrets of any kind). ────────────────────────
  desktop:
    needs: [plan, desktop-tests]
    if: needs.plan.outputs.has_desktop == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: { ref: '${{ inputs.source_sha }}', fetch-depth: 0 }
      - name: Verify exact source and lineage
        shell: bash
        env:
          GITHUB_SHA: ${{ inputs.source_sha }}
        run: |
          [ "$(git rev-parse HEAD)" = "${{ inputs.source_sha }}" ] || { echo "::error::checked-out HEAD is not source_sha"; exit 1; }
          python3 tools/verify_release_source.py
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Xvfb (Linux launch test needs a display)
        if: matrix.platform == 'linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq xvfb
      - name: Package
        shell: bash
        run: desktop/scripts/package.sh ${{ matrix.platform }}
      - name: Unpack the packaged artifact (what a player would get)
        shell: bash
        run: |
          mkdir -p unpacked && cd unpacked
          if [ "${{ matrix.ext }}" = zip ]; then 7z x -y ../desktop/dist/*.zip >/dev/null || unzip -q ../desktop/dist/*.zip
          else tar -xzf ../desktop/dist/*.tar.gz; fi
      - name: Launch test of the packaged build (real window; full play-through, save, restart, resume)
        id: smoke
        shell: bash
        run: desktop/scripts/smoke.sh "unpacked/${{ matrix.launcher }}" "$PWD/smoke-shots"
      - name: Provenance manifest
        if: always() && (hashFiles('desktop/dist/*.tar.gz') != '' || hashFiles('desktop/dist/*.zip') != '')
        shell: bash
        env:
          LAUNCH_TESTED: ${{ steps.smoke.outcome == 'success' && 'true' || 'false' }}
          GITHUB_SHA: ${{ inputs.source_sha }}
        run: |
          ART=$(ls desktop/dist/*.tar.gz desktop/dist/*.zip 2>/dev/null | head -1)
          python3 tools/make_release_manifest.py "$ART" "desktop/dist/build-manifest-${{ matrix.platform }}.json" --platform=${{ matrix.platform }}
          python3 tools/verify_release_source.py --manifest "desktop/dist/build-manifest-${{ matrix.platform }}.json" --apk "$ART"
      - uses: actions/upload-artifact@v4
        with:
          name: Build-${{ inputs.build_number }}-${{ matrix.platform }}-${{ inputs.source_sha }}
          path: |
            desktop/dist/*.tar.gz
            desktop/dist/*.zip
            desktop/dist/build-manifest-*.json
          if-no-files-found: error
          retention-days: 14
      - name: Upload launch-test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: launch-test-${{ matrix.platform }}-${{ inputs.source_sha }}
          path: smoke-shots/*
          if-no-files-found: ignore
          retention-days: 14

  # ── 4. Publish: only on request, only after EVERY selected platform passed. ───────────────
  publish:
    needs: [plan, desktop-tests, android, desktop]
    if: ${{ always() && inputs.destination == 'github_releases' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Require every selected platform to have succeeded (no partial release)
        env:
          PLATFORMS: ${{ needs.plan.outputs.platforms }}
          PLAN: ${{ needs.plan.result }}
          ANDROID: ${{ needs.android.result }}
          DESKTOP: ${{ needs.desktop.result }}
          DTESTS: ${{ needs.desktop-tests.result }}
        run: |
          [ "$PLAN" = success ] || { echo "::error::plan did not succeed"; exit 1; }
          case ",$PLATFORMS," in *,android,*) [ "$ANDROID" = success ] || { echo "::error::android did not succeed ($ANDROID)"; exit 1; };; esac
          case ",$PLATFORMS," in *,linux,*|*,windows,*) [ "$DESKTOP" = success ] && [ "$DTESTS" = success ] || { echo "::error::desktop did not fully succeed ($DESKTOP/$DTESTS)"; exit 1; };; esac
      - uses: actions/checkout@v4
        with: { ref: '${{ inputs.source_sha }}', fetch-depth: 0 }
      - uses: actions/download-artifact@v4
        with:
          pattern: Build-${{ inputs.build_number }}-*-${{ inputs.source_sha }}
          merge-multiple: true
          path: dist
      - name: Verify the set, merge manifests, write checksums
        env:
          PLATFORMS: ${{ needs.plan.outputs.platforms }}
          GITHUB_SHA: ${{ inputs.source_sha }}
        run: |
          python3 tools/merge_build_manifest.py --dir dist --expect "$PLATFORMS"
          (cd dist && sha256sum -c checksums.sha256)
          mkdir -p parts && mv dist/build-manifest-*.json parts/     # per-platform manifests stay out of the release
          python3 tools/verify_release_source.py
          ls -l dist
      - name: Create the release (never replaces an existing one)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          N="$BUILD_NUMBER"; SHA="${{ inputs.source_sha }}"; REPO="${{ github.repository }}"
          for t in "build-$N" "build-v$N" "v$N"; do
            if git ls-remote --exit-code --tags origin "refs/tags/$t" >/dev/null 2>&1 || gh release view "$t" --repo "$REPO" >/dev/null 2>&1; then
              echo "::error::$t already exists; refusing to publish"; exit 1
            fi
          done
          cat > "$RUNNER_TEMP/notes.md" <<EOF
          # My Personal Crossword Build ${N}

          Platforms in this build: ${{ needs.plan.outputs.platforms }}. Every file below was built from the single commit ${SHA}.

          - Android: debug-signed test build (same signing identity as earlier builds); install over the existing app.
          - Windows / Linux: unsigned desktop builds with a bundled Java runtime. Not Steam Deck Verified; real-hardware testing is pending.
          - \`build-manifest.json\` records source, toolchain, timestamps and hashes; \`checksums.sha256\` lists SHA-256 for every file.
          - CI run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          EOF
          cd dist
          gh release create "build-$N" ./* --repo "$REPO" --target "$SHA" \
            --title "My Personal Crossword Build $N" --notes-file "$RUNNER_TEMP/notes.md"
